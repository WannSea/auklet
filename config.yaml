trim: # neutral trim of the servos in degrees
  port: -4.0
  starboard: 14.0
  aft: -12.0
  rudder: 20.0
receiver:
  sensitivity: # sensitivity of the channels in degrees
    roll: 10.0 # degrees
    pitch: 10.0 # degrees
    yaw_rate: 180.0 # degrees/s
    altitude: 0.1 # meter
  default_setpoint:
    roll: 0.0
    pitch: 3.0
    yaw_rate: 0.0
    altitude: 0.3
logging_interval_ms: 250
controller:
  roll:
    p: 0.07
    i: 0.0
    d: 0.0
    i_limit: 25.0

  pitch:
    p: 0.2
    i: 0.0
    d: 0.0
    i_limit: 25.0

  yaw:
    p: 0.3
    i: 0.0
    d: 0.0
    i_limit: 25.0

  altitude:
    p: 5.0
    i: 0.0
    d: 0.0
    i_limit: 5.0

  # Mix matrix that maps control outputs to actuators
  mix_matrix:
  # roll, pitch, yaw, altitude
    - [ 15.0, 0.0,  0.0, -11.0]  # Port 
    - [-15.0, 0.0,  0.0, -11.0]  # Starboard
    - [ 0.0, 15.0,  0.0, -23.0]  # Aft
    - [ 0.0,  0.0,  1.0,  0.0]  # Rudder
